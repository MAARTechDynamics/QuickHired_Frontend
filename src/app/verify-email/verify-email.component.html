
<style>
    .otp-input {
    border: 2px solid #ccc;
    border-radius: 8px;
    transition: all 0.3s ease-in-out;
}

.otp-input:focus {
    border-color: #007bff;
    box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
    outline: none;
}

</style>

	<!--begin::Body-->
	<body id="kt_body" class="auth-bg bgi-size-cover bgi-attachment-fixed bgi-position-center bgi-no-repeat">
		<!--begin::Theme mode setup on page load-->
		<script>var defaultThemeMode = "light"; var themeMode; if ( document.documentElement ) { if ( document.documentElement.hasAttribute("data-bs-theme-mode")) { themeMode = document.documentElement.getAttribute("data-bs-theme-mode"); } else { if ( localStorage.getItem("data-bs-theme") !== null ) { themeMode = localStorage.getItem("data-bs-theme"); } else { themeMode = defaultThemeMode; } } if (themeMode === "system") { themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } document.documentElement.setAttribute("data-bs-theme", themeMode); }</script>
		<!--end::Theme mode setup on page load-->
		<!--begin::Main-->
		<!--begin::Root-->
		<div class="d-flex flex-column flex-root">
			<style>
                body { 
                    background-image: url('/assets/media/auth/bg4.jpg'); 
                } 

                [data-bs-theme="dark"] body { 
                    background-image: url('/assets/media/auth/bg4-dark.jpg'); 
                }
           </style>
			<!--begin::Authentication - Two-factor -->
			<div class="d-flex flex-column flex-column-fluid flex-lg-row">
				<!--begin::Aside-->
				<div class="d-flex flex-center w-lg-50 pt-15 pt-lg-0 px-10">
					<!--begin::Aside-->
					<div class="d-flex flex-center flex-lg-start flex-column">
						<!--begin::Logo-->
						<a href="index.html" class="mb-7">
							<img alt="Logo" src="assets/media/logos/QuickHireWhited.png" style="height:90px;" />
						</a>
						<!--end::Logo-->
						
					</div>
					<!--begin::Aside-->
				</div>
				<!--begin::Aside-->
				<!--begin::Body-->
				<div class="d-flex flex-column-fluid flex-lg-row-auto justify-content-center justify-content-lg-end p-12 p-lg-20">
					<!--begin::Card-->
					<div class="bg-body d-flex flex-column align-items-stretch flex-center rounded-4 w-md-600px p-20">
						<!--begin::Wrapper-->
						<div class="d-flex flex-center flex-column flex-column-fluid px-lg-10 pb-15 pb-lg-20">
							<!--begin::Form-->
							<form [formGroup]="verifyForm" (ngSubmit)="submitVerification()" class="form w-100 mb-13">
                                <div class="text-center mb-10">
                                    <img alt="Logo" class="mh-125px" src="assets/media/svg/misc/Gmail-Logo.wine.svg" />
                                </div>

                                <div class="text-center mb-10">
                                    <h1 class="text-gray-900 mb-3">Email Verification</h1>
                                    <div class="text-muted fw-semibold fs-5 mb-5">
                                    Enter the verification code we sent to
                                    </div>
                                    <div class="fw-bold text-gray-900 fs-3">
                                    {{ email ? maskEmail(email) : '*****@example.com' }}
                                    </div>
                                </div>
                                <div *ngIf="errorMessage" class="alert alert-danger text-center d-flex align-items-center justify-content-center fs-4">
                                    {{ errorMessage }}
                                </div>
                                <div *ngIf="successMessage" class="alert alert-success text-center d-flex align-items-center justify-content-center fs-4">
                                    {{ successMessage }}
                                </div>

                                <div class="mb-10">
                                    <div class="fw-bold text-start text-gray-900 fs-6 mb-1 ms-1">Type your 6-digit security code</div>

                                    <div class="d-flex flex-wrap flex-stack">
                                        <input type="text" formControlName="code_1" maxlength="1" class="form-control otp-input bg-transparent h-60px w-60px fs-2qx text-center mx-1 my-2" (input)="moveToNext($event, 'code_2')" />
                                        <input type="text" formControlName="code_2" maxlength="1" class="form-control otp-input bg-transparent h-60px w-60px fs-2qx text-center mx-1 my-2" (input)="moveToNext($event, 'code_3')" />
                                        <input type="text" formControlName="code_3" maxlength="1" class="form-control otp-input bg-transparent h-60px w-60px fs-2qx text-center mx-1 my-2" (input)="moveToNext($event, 'code_4')" />
                                        <input type="text" formControlName="code_4" maxlength="1" class="form-control otp-input bg-transparent h-60px w-60px fs-2qx text-center mx-1 my-2" (input)="moveToNext($event, 'code_5')" />
                                        <input type="text" formControlName="code_5" maxlength="1" class="form-control otp-input bg-transparent h-60px w-60px fs-2qx text-center mx-1 my-2" (input)="moveToNext($event, 'code_6')" />
                                        <input type="text" formControlName="code_6" maxlength="1" class="form-control otp-input bg-transparent h-60px w-60px fs-2qx text-center mx-1 my-2" />
                                </div>


                                    <div class="text-danger mt-2" *ngIf="verifyForm.invalid && verifyForm.touched">
                                    Please enter all 6 digits correctly.
                                    </div>
                                </div>

                                <div class="d-flex flex-center">
                                    <button type="submit" class="btn btn-lg btn-primary fw-bold" [disabled]="isSubmitting || verifyForm.invalid">
                                    <span class="indicator-label">Submit</span>
                                    <span *ngIf="isSubmitting" class="indicator-progress">
                                        Please wait... <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                                    </span>
                                    </button>
                                </div>
                           </form>

							<!--end::Form-->
							<!--begin::Notice-->
                            <div class="text-center fw-semibold fs-5">
                                <span class="text-muted me-1">Didn’t get the code?</span>
                                <span class="link-primary fs-5 me-1" (click)="resendCode()" style="cursor: pointer;">
                                    Resend
                                </span>
                            </div>
                            <!--end::Notice-->

						</div>
						<!--end::Wrapper-->
						<!--begin::Footer-->
						
						<!--end::Footer-->
					</div>
					<!--end::Card-->
				</div>
				<!--end::Body-->
			</div>
			<!--end::Authentication - Two-factor-->
		</div>
		<!--end::Root-->
		<!--end::Main-->
		<!--begin::Javascript-->
		<script>var hostUrl = "assets/";</script>
		<!--begin::Global Javascript Bundle(mandatory for all pages)-->
		<script src="assets/plugins/global/plugins.bundle.js"></script>
		<script src="assets/js/scripts.bundle.js"></script>
		<!--end::Global Javascript Bundle-->
		<!--begin::Custom Javascript(used for this page only)-->
		<script src="assets/js/custom/authentication/sign-in/two-factor.js"></script>
		<!--end::Custom Javascript-->
		<!--end::Javascript-->
	</body>
	<!--end::Body-->
