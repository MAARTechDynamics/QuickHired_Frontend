<!--begin::Body-->
<body id="kt_body" class="auth-bg bgi-size-cover bgi-attachment-fixed bgi-position-center bgi-no-repeat h-850px">
    <!--begin::Theme mode setup on page load-->
    <script>var defaultThemeMode = "light"; var themeMode; if ( document.documentElement ) { if ( document.documentElement.hasAttribute("data-bs-theme-mode")) { themeMode = document.documentElement.getAttribute("data-bs-theme-mode"); } else { if ( localStorage.getItem("data-bs-theme") !== null ) { themeMode = localStorage.getItem("data-bs-theme"); } else { themeMode = defaultThemeMode; } } if (themeMode === "system") { themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } document.documentElement.setAttribute("data-bs-theme", themeMode); }</script>
    <!--end::Theme mode setup on page load-->
    <!--begin::Main-->
    <!--begin::Root-->
    <div class="d-flex flex-column flex-root">
        <style>
                body { 
                    background-image: url('/assets/media/auth/bg4.jpg'); 
                } 

                [data-bs-theme="dark"] body { 
                    background-image: url('/assets/media/auth/bg4-dark.jpg'); 
                }
        </style>
        <!--begin::Authentication - Sign-in -->
        <div class="d-flex flex-column flex-column-fluid flex-lg-row">
            <!--begin::Aside-->
            <div class="d-flex flex-center w-lg-50 pt-15 pt-lg-0 px-10">
                <!--begin::Aside-->
                <div class="d-flex flex-center flex-lg-start flex-column">
                    <!--begin::Logo-->
                    <a href="index.html" class="mb-7">
                        <img alt="Logo" src="assets/media/logos/QuickHireWhited.png" style="height:90px;" />
                    </a>
                    <!--end::Logo-->
                    <!--begin::Title-->
                  
                    <!--end::Title-->
                </div>
                <!--begin::Aside-->
            </div>
            <!--begin::Aside-->
            <!--begin::Body-->
            <div class="d-flex flex-column-fluid flex-lg-row-auto justify-content-center justify-content-lg-end p-12 p-lg-20">
                <!--begin::Card-->
                <div class="premium-forgot-card bg-body d-flex flex-column align-items-stretch flex-center rounded-4 w-md-600px p-50">
                    <!--begin::Wrapper-->
                    <div class="d-flex flex-center flex-column flex-column-fluid px-lg-10 pb-15 pb-lg-20">
                    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="form w-100 px-4 px-md-10" novalidate>
                        <!-- Header -->
                        <div class="text-center mb-10">
                            <h1 class="premium-forgot-title text-gray-900 fw-bolder mb-3 fs-2 fs-md-1">Forgot Password?</h1>
                            <div class="premium-forgot-subtitle text-gray-500 fw-semibold fs-6">Enter your email to reset your password.</div>
                        </div>

                        <!-- Email Input -->
                        <div class="fv-row mb-8">
                            <input
                            type="email"
                            placeholder="Email"
                            formControlName="email"
                            class="premium-form-control form-control form-control-lg bg-transparent"
                            [ngClass]="{ 'is-invalid': email?.touched && email?.invalid }"
                            />
                            <div class="premium-error invalid-feedback" *ngIf="email?.touched && email?.errors?.['required']">
                            <i class="bi bi-exclamation-circle me-1"></i>Email is required
                            </div>
                            <div class="premium-error invalid-feedback" *ngIf="email?.touched && email?.errors?.['email']">
                            <i class="bi bi-exclamation-circle me-1"></i>Invalid email format
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mb-10">
                            <button
                            type="submit"
                            class="premium-submit-btn btn btn-primary py-3"
                            [disabled]="forgotPasswordForm.invalid || isSubmitting"
                            >
                            <span *ngIf="!isSubmitting">Submit</span>
                            <span *ngIf="isSubmitting" class="indicator-progress">
                                Please wait...
                                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                            </span>
                            </button>
                        </div>

                        <!-- Cancel Link -->
                        <div class="text-center">
                            <a routerLink="/login" class="premium-cancel-btn btn btn-light">Cancel</a>
                        </div>
                    </form>


                    </div>
                    <!--end::Wrapper-->
                   
                </div>
                <!--end::Card-->
            </div>
            <!--end::Body-->
        </div>
        <!--end::Authentication - Sign-in-->
    </div>
    <!--end::Root-->
    <!--end::Main-->
    <!--begin::Javascript-->
    <script>var hostUrl = "assets/";</script>
    <!--begin::Global Javascript Bundle(mandatory for all pages)-->
    <script src="assets/plugins/global/plugins.bundle.js"></script>
    <script src="assets/js/scripts.bundle.js"></script>
    <!--end::Global Javascript Bundle-->
    <!--begin::Custom Javascript(used for this page only)-->
    <script src="assets/js/custom/authentication/sign-in/general.js"></script>
    <!--end::Custom Javascript-->
    <!--end::Javascript-->
</body>
<!--end::Body-->
